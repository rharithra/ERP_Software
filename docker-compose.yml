services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: retailflow
      POSTGRES_USER: retailflow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-retailflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - retailflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailflow -d retailflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 38422
      DATABASE_URL: jdbc:postgresql://postgres:5432/retailflow
      DATABASE_USERNAME: retailflow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-retailflow_dev}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment. Generate a random 64+ character secret. Do not use the documented local-dev default on a VPS.}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:38421,http://127.0.0.1:38421}
    ports:
      - "38422:38422"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      - api
    ports:
      - "38421:80"

volumes:
  retailflow_pg:
